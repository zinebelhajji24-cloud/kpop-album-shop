<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-pop Album Shop</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">
    🌸 K-pop Album Shop 🌸
  </div>
  
  <img src="images/shop-banner.png" alt="K-pop Shop">

  <h1>Your favorite albums in one place</h1>
  <p>Discover, collect and enjoy your K-pop albums ✨</p>
</header>

<div class="search">
  <input type="text" placeholder="Search your album...">
</div>

<section class="categories">
  <div class="category">
    🎤 Boy Groups
  </div>

  <div class="category">
    💗 Girl Groups
  </div>
</section>
  <section class="albums">

  <div class="album-card">
  <img src="images/album1.png" alt="Album 1">
  <h2>BLACKPINK</h2>
  <p>Born Pink</p>
  <p>Price: 250 DH</p>
    <button>View Album</button>
<button>Add to Cart</button>
</div>

<div class="album-card">
  <img src="images/album2.png" alt="Album 2">
  <h2>BTS</h2>
  <p>PROOF</p>
  <p>Price: 250 DH</p>
  <button>View Album</button>
<button>Add to Cart</button>
</div>

<div class="album-card">
  <img src="images/album3.png" alt="Album 3">
  <h2>NewJeans</h2>
  <p>Get Up</p>
  <p>Price: 250 DH</p>
  <button>View Album</button>
<button>Add to Cart</button>
</div>

  <div class="album-card">
    <h2>Coming Soon</h2>
    <p>New album arriving ✨</p>
  </div>

</section>

</body>
</html>
