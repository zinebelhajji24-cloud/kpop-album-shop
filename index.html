<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-pop Album Shop</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>✨ K-pop Album Shop ✨</h1>
  <p>Your favorite albums in one place</p>
</header>

<div class="search">
  <input type="text" placeholder="Search your album...">
</div>

<section class="categories">
  <div class="category">
    🎤 Boy Groups
  </div>

  <div class="category">
    💗 Girl Groups
  </div>
</section>
  <section class="albums">

  <div class="album-card">
    <h2>Album Name</h2>
    <p>K-pop Group</p>
    <p>Price: 250 DH</p>
  </div>

  <div class="album-card">
    <h2>Coming Soon</h2>
    <p>New album arriving ✨</p>
  </div>

</section>

</body>
</html>
